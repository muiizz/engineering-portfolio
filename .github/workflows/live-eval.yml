name: Live model evaluation
# Manual only. Calls paid model APIs, so it never runs on push or pull request.
on:
  workflow_dispatch:
    inputs:
      anthropic_models:
        description: Claude model IDs, comma separated
        default: claude-haiku-5-5,claude-sonnet-5-5,claude-opus-5-5
      runs:
        description: Runs per model
        default: '3'
      limit:
        description: Cases per run (0 means all 120)
        default: '0'
permissions:
  contents: write
concurrency:
  group: live-eval
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Evaluation gate against live models
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ inputs.anthropic_models }}
          RUNS: ${{ inputs.runs }}
          LIMIT: ${{ inputs.limit }}
        run: python labs/eval-gate/live.py --runs "$RUNS" --limit "$LIMIT" --max-tokens 400000 --out labs/eval-gate/live-results
      - name: Retrieval with a learned embedding model
        continue-on-error: true
        run: |
          python -m pip install --quiet sentence-transformers==6.3.0
          python labs/support-kb/embed_eval.py --out labs/support-kb/embed-results.json
      - name: Publish results to the live-results branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B live-results
          git add -f labs/eval-gate/live-results || true
          git add -f labs/support-kb/embed-results.json || true
          git commit -m "Live evaluation results from run ${GITHUB_RUN_ID}"
          git push --force origin live-results
