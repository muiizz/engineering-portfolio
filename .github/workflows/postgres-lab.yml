name: PostgreSQL operations lab
on:
  pull_request:
    paths:
      - 'labs/postgres/**'
      - '.github/workflows/postgres-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-24.04
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 3s
          --health-timeout 3s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enable query statistics in the disposable database
        run: |
          psql -X -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET shared_preload_libraries = 'pg_stat_statements'"
          docker restart "${{ job.services.db.id }}"
          for i in {1..30}; do
            if pg_isready -q; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify RLS, migration, vacuum and query statistics
        run: |
          cd labs/postgres
          psql -X -v ON_ERROR_STOP=1 -f sql/seed.sql -f operations.sql -f query-stats.sql
