name: Webhook queue integration
on:
  pull_request:
    paths:
      - 'labs/webhook-queue/**'
      - '.github/workflows/webhook-queue.yml'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-24.04
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 3s
          --health-timeout 3s --health-retries 20
    env:
      WEBHOOK_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - working-directory: labs/webhook-queue
        run: |
          python -m pip install -r requirements.txt
          psql "$WEBHOOK_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f schema.sql
          python verify.py
