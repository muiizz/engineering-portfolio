name: Creative automation checks
on:
  pull_request:
    paths:
      - 'labs/creative-flow/**'
      - '.github/workflows/creative-flow.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workflow:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Execute imported n8n workflow
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/n8n"
          docker run --rm --user "$(id -u):$(id -g)" -e N8N_USER_FOLDER=/state -v "$RUNNER_TEMP/n8n:/state" -v "$PWD/labs/creative-flow:/workflow:ro" n8nio/n8n:1.121.3 execute --file=/workflow/workflow.json | tee "$RUNNER_TEMP/n8n-result"
          rg -q '"status":\s*"awaiting_review"' "$RUNNER_TEMP/n8n-result"
      - name: Export and inspect layered PSD
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick fonts-dejavu-core
          cd labs/creative-flow
          bash export_layers.sh brief.json "$RUNNER_TEMP/campaign.psd"
          test "$(identify "$RUNNER_TEMP/campaign.psd" | wc -l)" -eq 3
          sed 's/"approved"/"pending"/' brief.json > "$RUNNER_TEMP/pending.json"
          if bash export_layers.sh "$RUNNER_TEMP/pending.json" "$RUNNER_TEMP/pending.psd"; then exit 1; fi
          test ! -e "$RUNNER_TEMP/pending.psd"
